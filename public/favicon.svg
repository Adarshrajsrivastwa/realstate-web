<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: ACE crimson red -->
  <rect width="64" height="64" rx="12" fill="#8B0000"/>

  <!-- Subtle inner glow/depth overlay -->
  <rect width="64" height="64" rx="12" fill="url(#grad)" opacity="0.35"/>

  <defs>
    <radialGradient id="grad" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- Stylized "A" letter in white — bold, clean -->
  <!-- Left diagonal leg -->
  <polygon points="10,52 22,12 28,12 18,52" fill="#ffffff"/>
  <!-- Right diagonal leg -->
  <polygon points="36,12 42,12 54,52 44,52" fill="#ffffff"/>
  <!-- Crossbar -->
  <rect x="18" y="33" width="28" height="7" rx="2" fill="#ffffff"/>

  <!-- Small decorative dot at top — brand touch -->
  <circle cx="32" cy="8" r="3" fill="#ffffff" opacity="0.45"/>
</svg>